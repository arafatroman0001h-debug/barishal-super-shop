<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বরিশাল সুপার শপ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f5f7f9;
  color:#222;
}

header{
  background:#0a9f58;
  color:white;
  padding:15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:24px;
}

.top-buttons{
  margin-top:10px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
  border-radius:8px;
  padding:10px 15px;
  font-weight:bold;
}

.top-buttons button{
  background:white;
  color:#07894c;
}

.hero{
  background:#e4f8ec;
  text-align:center;
  padding:30px 15px;
}

.hero h2{
  color:#07894c;
  font-size:28px;
  margin-bottom:8px;
}

.hero p{
  font-size:16px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:20px;
  font-size:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

.product{
  background:white;
  border-radius:15px;
  padding:15px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product .emoji{
  font-size:55px;
  margin:10px;
}

.product h3{
  margin:8px 0;
}

.price{
  color:#0a9f58;
  font-size:18px;
  font-weight:bold;
  margin:8px;
}

.add{
  background:#0a9f58;
  color:white;
  width:100%;
}

.cart{
  margin-top:25px;
  background:white;
  padding:20px;
  border-radius:15px;
}

.cart h2{
  color:#07894c;
  margin-bottom:12px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
  gap:10px;
}

.qty{
  display:flex;
  align-items:center;
  gap:5px;
}

.qty button{
  padding:5px 9px;
  background:#eee;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin:15px 0;
}

.checkout{
  background:#ff7a00;
  color:white;
  width:100%;
  font-size:17px;
}

.form-box{
  display:none;
  margin-top:20px;
  background:#f1fff6;
  padding:18px;
  border-radius:12px;
}

.form-box input,
.form-box textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.confirm{
  background:#0a9f58;
  color:white;
  width:100%;
  margin-top:8px;
}

.login-box{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  background:white;
  width:100%;
  max-width:400px;
  padding:20px;
  border-radius:15px;
}

.login-card h2{
  text-align:center;
  color:#07894c;
  margin-bottom:15px;
}

.login-card input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

.login-btn{
  background:#0a9f58;
  color:white;
  width:100%;
  margin-top:8px;
}

.register-btn{
  background:#eee;
  width:100%;
  margin-top:8px;
}

.close-btn{
  background:#e53935;
  color:white;
  width:100%;
  margin-top:8px;
}

.user-status{
  margin-top:8px;
  font-size:14px;
}

.success{
  display:none;
  margin-top:20px;
  background:#e9fff1;
  border:1px solid #0a9f58;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#073d25;
  color:white;
}

@media(max-width:500px){
  .product .emoji{
    font-size:45px;
  }

  .hero h2{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛒 বরিশাল সুপার শপ</h1>

  <div class="top-buttons">
    <button onclick="openLogin()">👤 Login</button>
    <button onclick="toggleLanguage()">বাংলা / English</button>
    <button onclick="showCart()">🛒 কার্ট (<span id="cartCount">0</span>)</button>
  </div>

  <div class="user-status" id="userStatus">অতিথি ব্যবহারকারী</div>
</header>

<section class="hero">
  <h2>বরিশাল সুপার শপ</h2>
  <p>আপনার প্রয়োজনীয় পণ্য এখন সহজেই অর্ডার করুন</p>
</section>

<div class="container">

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔎 পণ্য খুঁজুন..."
    oninput="searchProducts()"
  >

  <div class="products" id="products"></div>

  <div class="cart" id="cartSection">
    <h2>🛒 আপনার কার্ট</h2>

    <div id="cartItems">
      <p>কার্ট খালি</p>
    </div>

    <div class="total">
      মোট: ৳ <span id="total">0</span>
    </div>

    <button class="checkout" onclick="openOrderForm()">
      অর্ডার করুন
    </button>

    <div class="form-box" id="orderForm">

      <h3>📦 অর্ডারের তথ্য</h3>

      <input
        id="customerName"
        type="text"
        placeholder="আপনার নাম"
      >

      <input
        id="customerPhone"
        type="tel"
        placeholder="মোবাইল নম্বর"
      >

      <textarea
        id="customerAddress"
        rows="3"
        placeholder="সম্পূর্ণ ঠিকানা"
      ></textarea>

      <textarea
        id="customerNote"
        rows="2"
        placeholder="অতিরিক্ত তথ্য (ঐচ্ছিক)"
      ></textarea>

      <button class="confirm" onclick="placeOrder()">
        ✅ অর্ডার কনফার্ম করুন
      </button>

    </div>

    <div class="success" id="successBox">
      <h2>🎉 অর্ডার সফল!</h2>
      <p id="successText"></p>
    </div>

  </div>

</div>

<div class="login-box" id="loginBox">

  <div class="login-card">

    <h2>👤 Login / Register</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button class="login-btn" onclick="loginUser()">
      Login
    </button>

    <button class="register-btn" onclick="registerUser()">
      নতুন Account তৈরি করুন
    </button>

    <button class="close-btn" onclick="closeLogin()">
      বন্ধ করুন
    </button>

  </div>

</div>

<footer>
  © 2026 বরিশাল সুপার শপ
</footer>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAYlIFso46tdo9E-jig-tzGo3Sv77dpaPg",
  authDomain: "barishal-super-shop.firebaseapp.com",
  projectId: "barishal-super-shop",
  storageBucket: "barishal-super-shop.firebasestorage.app",
  messagingSenderId: "484705312821",
  appId: "1:484705312821:web:6c2a3fc2a26bb21ac5517c",
  measurementId: "G-J6LHSKVHN2"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


const products = [
  {id:1,name:"চাল",price:80,unit:"কেজি",emoji:"🍚"},
  {id:2,name:"সয়াবিন তেল",price:180,unit:"লিটার",emoji:"🫗"},
  {id:3,name:"চিনি",price:130,unit:"কেজি",emoji:"🍬"},
  {id:4,name:"লবণ",price:40,unit:"কেজি",emoji:"🧂"},
  {id:5,name:"আলু",price:45,unit:"কেজি",emoji:"🥔"},
  {id:6,name:"সাবান",price:50,unit:"পিস",emoji:"🧼"},
  {id:7,name:"পেঁয়াজ",price:70,unit:"কেজি",emoji:"🧅"},
  {id:8,name:"ডিম",price:140,unit:"ডজন",emoji:"🥚"}
];

let cart = JSON.parse(localStorage.getItem("barishal_cart")) || [];


function showProducts(list=products){

  const box = document.getElementById("products");

  box.innerHTML = "";

  list.forEach(p => {

    box.innerHTML += `
      <div class="product">

        <div class="emoji">${p.emoji}</div>

        <h3>${p.name}</h3>

        <div class="price">
          ৳${p.price} / ${p.unit}
        </div>

        <button
          class="add"
          onclick="addToCart(${p.id})">
          🛒 কার্টে যোগ করুন
        </button>

      </div>
    `;

  });

}


function addToCart(id){

  const product = products.find(p => p.id === id);

  const item = cart.find(x => x.id === id);

  if(item){
    item.qty++;
  }else{
    cart.push({
      id:product.id,
      name:product.name,
      price:product.price,
      qty:1
    });
  }

  saveCart();

}


function changeQty(id,amount){

  const item = cart.find(x => x.id === id);

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){
    cart = cart.filter(x => x.id !== id);
  }

  saveCart();

}


function saveCart(){

  localStorage.setItem(
    "barishal_cart",
    JSON.stringify(cart)
  );

  renderCart();

}


function renderCart(){

  const box = document.getElementById("cartItems");

  let total = 0;
  let count = 0;

  if(cart.length === 0){

    box.innerHTML = "<p>কার্ট খালি</p>";

  }else{

    box.innerHTML = "";

    cart.forEach(item => {

      const subtotal = item.price * item.qty;

      total += subtotal;
      count += item.qty;

      box.innerHTML += `
        <div class="cart-item">

          <div>
            <b>${item.name}</b><br>
            ৳${item.price} × ${item.qty}
          </div>

          <div class="qty">
            <button onclick="changeQty(${item.id},-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${item.id},1)">+</button>
          </div>

        </div>
      `;

    });

  }

  document.getElementById("total").textContent = total;
  document.getElementById("cartCount").textContent = count;

}


function showCart(){

  document
    .getElementById("cartSection")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function openOrderForm(){

  if(cart.length === 0){

    alert("আগে কিছু পণ্য কার্টে যোগ করুন।");
    return;

  }

  document.getElementById("orderForm").style.display = "block";

  document
    .getElementById("orderForm")
    .scrollIntoView({
      behavior:"smooth"
    });

}


async function placeOrder(){

  if(cart.length === 0){

    alert("কার্ট খালি।");
    return;

  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const note =
    document.getElementById("customerNote").value.trim();

  if(!name || !phone || !address){

    alert("নাম, মোবাইল নম্বর এবং ঠিকানা দিন।");
    return;

  }

  let total = 0;

  cart.forEach(item => {
    total += item.price * item.qty;
  });

  const orderId =
    "BSS-" + Date.now();

  try{

    await db.collection("orders").doc(orderId).set({

      orderId:orderId,

      customerName:name,

      phone:phone,

      address:address,

      note:note,

      products:cart,

      total:total,

      status:"নতুন",

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    document.getElementById("successBox").style.display = "block";

    document.getElementById("successText").innerHTML =
      "আপনার অর্ডার নম্বর: <b>" +
      orderId +
      "</b><br>মোট মূল্য: <b>৳" +
      total +
      "</b>";

    cart = [];

    saveCart();

    document.getElementById("orderForm").style.display = "none";

  }catch(error){

    console.error(error);

    alert(
      "অর্ডার সংরক্ষণ করা যায়নি। Firebase-এর Firestore এখনো চালু না থাকলে আগে সেটি চালু করতে হবে।"
    );

  }

}


function searchProducts(){

  const text =
    document
    .getElementById("search")
    .value
    .toLowerCase();

  const result =
    products.filter(p =>
      p.name.toLowerCase().includes(text)
    );

  showProducts(result);

}


function openLogin(){

  document.getElementById("loginBox").style.display="flex";

}


function closeLogin(){

  document.getElementById("loginBox").style.display="none";

}


async function registerUser(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Email এবং Password দিন।");
    return;

  }

  if(password.length < 6){

    alert("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
    return;

  }

  try{

    await auth.createUserWithEmailAndPassword(
      email,
      password
    );

    alert("🎉 Account তৈরি হয়েছে!");

    closeLogin();

  }catch(error){

    alert("Account তৈরি করা যায়নি: " + error.message);

  }

}


async function loginUser(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Email এবং Password দিন।");
    return;

  }

  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

    alert("✅ Login সফল!");

    closeLogin();

  }catch(error){

    alert("Login করা যায়নি: " + error.message);

  }

}


auth.onAuthStateChanged(user => {

  const status =
    document.getElementById("userStatus");

  if(user){

    status.textContent =
      "✅ লগইন: " + user.email;

  }else{

    status.textContent =
      "অতিথি ব্যবহারকারী";

  }

});


function toggleLanguage(){

  alert(
    "বাংলা / English ভাষা সিস্টেম পরে আরও সম্পূর্ণভাবে যোগ করা হবে।"
  );

}


showProducts();
renderCart();

</script>

</body>
</html>
