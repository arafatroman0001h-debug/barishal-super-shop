<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বরিশাল সুপার শপ</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,"Noto Sans Bengali",sans-serif;
      background:#f5f5f5;
      color:#222
    }
    header{
      background:#006b3c;
      color:white;
      padding:18px 12px;
      text-align:center
    }
    header h1{margin:0 0 12px;font-size:27px}
    .top-buttons{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap
    }
    button{
      border:0;
      border-radius:10px;
      padding:11px 17px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer
    }
    .top-btn{background:white;color:#006b3c}
    .logout{background:#c62828;color:white}
    .container{
      max-width:1000px;
      margin:auto;
      padding:18px
    }
    .welcome{text-align:center}
    .welcome h2{color:#006b3c;font-size:30px}
    .search{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:17px;
      margin:15px 0
    }
    .products{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px
    }
    .product{
      background:white;
      border-radius:14px;
      padding:16px;
      text-align:center;
      box-shadow:0 2px 8px #0001
    }
    .product .emoji{font-size:45px}
    .product h3{margin:8px 0}
    .price{
      color:#008c4a;
      font-size:21px;
      font-weight:bold;
      margin:10px
    }
    .add{
      background:#006b3c;
      color:white;
      width:100%
    }
    .cart-box,.checkout{
      background:white;
      margin-top:20px;
      padding:18px;
      border-radius:14px;
      box-shadow:0 2px 8px #0001
    }
    .cart-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      padding:10px 0;
      border-bottom:1px solid #ddd
    }
    .qty button{
      padding:5px 10px;
      background:#eee
    }
    .remove{background:#e53935;color:white;padding:6px 10px}
    input,textarea{
      width:100%;
      padding:13px;
      margin:7px 0 12px;
      border:1px solid #ccc;
      border-radius:9px;
      font-size:16px
    }
    textarea{min-height:90px}
    .order-btn{
      width:100%;
      background:#006b3c;
      color:white;
      padding:14px
    }

    /* Modal */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:#0009;
      z-index:1000;
      overflow:auto
    }
    .modal-content{
      background:white;
      width:92%;
      max-width:500px;
      margin:60px auto;
      padding:22px;
      border-radius:16px;
      position:relative
    }
    .close{
      position:absolute;
      right:12px;
      top:8px;
      font-size:30px;
      cursor:pointer
    }
    .login-title{
      color:#006b3c;
      text-align:center;
      margin-top:5px
    }
    .login-tabs{
      display:flex;
      gap:8px;
      margin:15px 0
    }
    .login-tabs button{
      flex:1;
      background:#eee
    }
    .login-tabs .active{
      background:#006b3c;
      color:white
    }
    .auth-section{display:none}
    .auth-section.active{display:block}
    .phone-hint{
      font-size:13px;
      color:#666
    }
    #recaptcha-container{
      margin:10px 0
    }
    .secondary{
      background:#eee;
      width:100%;
      margin-top:8px
    }
    .user-info{
      margin-top:8px;
      font-size:14px;
      color:#fff
    }

    @media(max-width:600px){
      .products{grid-template-columns:repeat(2,1fr)}
      .product{padding:11px}
      .product .emoji{font-size:36px}
      .product h3{font-size:17px}
      .price{font-size:18px}
      button{font-size:14px}
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 বরিশাল সুপার শপ</h1>

  <div class="top-buttons">
    <button class="top-btn" onclick="openLogin()">👤 Login / Register</button>
    <button class="top-btn" onclick="alert('ভাষা পরিবর্তন সিস্টেম শীঘ্রই আসবে।')">
      বাংলা / English
    </button>
    <button class="top-btn" onclick="scrollToCart()">🛒 কার্ট (<span id="cartCount">0</span>)</button>
    <button id="logoutBtn" class="logout" style="display:none" onclick="logout()">Logout</button>
  </div>

  <div id="userInfo" class="user-info">অতিথি ব্যবহারকারী</div>
</header>

<div class="container">

  <div class="welcome">
    <h2>বরিশাল সুপার শপ</h2>
    <p>আপনার প্রয়োজনীয় পণ্য এখন সহজেই অর্ডার করুন</p>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 পণ্য খুঁজুন..."
    oninput="searchProducts()"
  >

  <div id="products" class="products"></div>

  <div id="cartBox" class="cart-box">
    <h2>🛒 আপনার কার্ট</h2>
    <div id="cartItems"></div>
    <h3>মোট: ৳<span id="cartTotal">0</span></h3>
  </div>

  <div class="checkout">
    <h2>📦 অর্ডার করুন</h2>

    <input id="customerName" placeholder="আপনার নাম">
    <input id="customerPhone" placeholder="ফোন নম্বর">
    <textarea id="customerAddress" placeholder="সম্পূর্ণ ঠিকানা"></textarea>
    <textarea id="customerNote" placeholder="অতিরিক্ত কথা (ঐচ্ছিক)"></textarea>

    <button class="order-btn" onclick="placeOrder()">অর্ডার কনফার্ম করুন</button>
  </div>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
  <div class="modal-content">

    <span class="close" onclick="closeLogin()">×</span>

    <h2 class="login-title">👤 Login / Register</h2>

    <div class="login-tabs">
      <button id="emailTab" class="active" onclick="showAuth('email')">
        Email
      </button>

      <button id="phoneTab" onclick="showAuth('phone')">
        📱 Phone OTP
      </button>
    </div>

    <!-- EMAIL LOGIN -->
    <div id="emailAuth" class="auth-section active">

      <input id="email" type="email" placeholder="Gmail / Email">

      <input id="password" type="password" placeholder="Password">

      <button class="order-btn" onclick="emailLogin()">
        Login
      </button>

      <button class="secondary" onclick="emailRegister()">
        নতুন অ্যাকাউন্ট তৈরি করুন
      </button>

    </div>

    <!-- PHONE LOGIN -->
    <div id="phoneAuth" class="auth-section">

      <p class="phone-hint">
        বাংলাদেশি নম্বর হলে 01XXXXXXXXX অথবা +8801XXXXXXXXX লিখতে পারো।
      </p>

      <input
        id="phoneNumber"
        type="tel"
        placeholder="01XXXXXXXXX"
      >

      <div id="recaptcha-container"></div>

      <button class="order-btn" onclick="sendOTP()">
        OTP পাঠান
      </button>

      <div id="otpArea" style="display:none">

        <input
          id="otpCode"
          type="number"
          placeholder="৬ সংখ্যার OTP লিখুন"
        >

        <button class="order-btn" onclick="verifyOTP()">
          OTP দিয়ে Login
        </button>

      </div>

    </div>

  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAYlIFso46tdo9E-jig-tzGo3Sv77dpaPg",
  authDomain: "barishal-super-shop.firebaseapp.com",
  projectId: "barishal-super-shop",
  storageBucket: "barishal-super-shop.firebasestorage.app",
  messagingSenderId: "484705312821",
  appId: "1:484705312821:web:e8eae37eaa74dcc0c5517c",
  measurementId: "G-K97DXFFCB5"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let confirmationResult = null;
let recaptchaVerifier = null;

const products = [
  {id:1,name:"চাল",price:80,unit:"কেজি",emoji:"🍚"},
  {id:2,name:"সয়াবিন তেল",price:180,unit:"লিটার",emoji:"🫗"},
  {id:3,name:"চিনি",price:130,unit:"কেজি",emoji:"🍬"},
  {id:4,name:"লবণ",price:40,unit:"কেজি",emoji:"🧂"},
  {id:5,name:"আলু",price:45,unit:"কেজি",emoji:"🥔"},
  {id:6,name:"সাবান",price:50,unit:"পিস",emoji:"🧼"},
  {id:7,name:"ডিম",price:70,unit:"ডজন",emoji:"🥚"},
  {id:8,name:"বিস্কুট",price:40,unit:"প্যাকেট",emoji:"🍪"}
];

let cart = JSON.parse(localStorage.getItem("barishal_cart") || "[]");

/* PRODUCTS */

function displayProducts(list = products){

  const box = document.getElementById("products");

  box.innerHTML = list.map(p => `
    <div class="product">
      <div class="emoji">${p.emoji}</div>
      <h3>${p.name}</h3>
      <div class="price">৳${p.price} / ${p.unit}</div>

      <button class="add" onclick="addToCart(${p.id})">
        🛒 কার্টে যোগ করুন
      </button>
    </div>
  `).join("");
}

function searchProducts(){

  const text = document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();

  const result = products.filter(p =>
    p.name.toLowerCase().includes(text)
  );

  displayProducts(result);
}

/* CART */

function addToCart(id){

  const product = products.find(p => p.id === id);

  const existing = cart.find(x => x.id === id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      id:product.id,
      name:product.name,
      price:product.price,
      unit:product.unit,
      qty:1
    });
  }

  saveCart();

  alert(product.name + " কার্টে যোগ হয়েছে");
}

function changeQty(id, amount){

  const item = cart.find(x => x.id === id);

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){
    cart = cart.filter(x => x.id !== id);
  }

  saveCart();
}

function removeItem(id){

  cart = cart.filter(x => x.id !== id);

  saveCart();
}

function saveCart(){

  localStorage.setItem(
    "barishal_cart",
    JSON.stringify(cart)
  );

  renderCart();
}

function renderCart(){

  const box = document.getElementById("cartItems");

  if(cart.length === 0){

    box.innerHTML = "<p>কার্ট খালি।</p>";

  }else{

    box.innerHTML = cart.map(item => `
      <div class="cart-item">

        <div>
          <b>${item.name}</b><br>
          ৳${item.price} × ${item.qty}
        </div>

        <div class="qty">
          <button onclick="changeQty(${item.id},-1)">−</button>
          <b>${item.qty}</b>
          <button onclick="changeQty(${item.id},1)">+</button>
          <button class="remove" onclick="removeItem(${item.id})">×</button>
        </div>

      </div>
    `).join("");
  }

  const total = cart.reduce(
    (sum,item) => sum + item.price * item.qty,
    0
  );

  const count = cart.reduce(
    (sum,item) => sum + item.qty,
    0
  );

  document.getElementById("cartTotal").textContent = total;
  document.getElementById("cartCount").textContent = count;
}

function scrollToCart(){

  document.getElementById("cartBox")
    .scrollIntoView({behavior:"smooth"});
}

/* AUTH MODAL */

function openLogin(){

  document.getElementById("loginModal").style.display = "block";
}

function closeLogin(){

  document.getElementById("loginModal").style.display = "none";
}

function showAuth(type){

  document.getElementById("emailAuth").classList.remove("active");
  document.getElementById("phoneAuth").classList.remove("active");

  document.getElementById("emailTab").classList.remove("active");
  document.getElementById("phoneTab").classList.remove("active");

  if(type === "email"){

    document.getElementById("emailAuth").classList.add("active");
    document.getElementById("emailTab").classList.add("active");

  }else{

    document.getElementById("phoneAuth").classList.add("active");
    document.getElementById("phoneTab").classList.add("active");

    setupRecaptcha();
  }
}

/* EMAIL LOGIN */

function emailRegister(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){

    alert("Email এবং Password দিন।");
    return;
  }

  if(password.length < 6){

    alert("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
    return;
  }

  auth.createUserWithEmailAndPassword(email,password)
    .then(() => {

      alert("অ্যাকাউন্ট তৈরি হয়েছে। 🎉");
      closeLogin();

    })
    .catch(error => {

      alert("Register সমস্যা: " + error.message);

    });
}

function emailLogin(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){

    alert("Email এবং Password দিন।");
    return;
  }

  auth.signInWithEmailAndPassword(email,password)
    .then(() => {

      alert("Login সফল হয়েছে। 🎉");
      closeLogin();

    })
    .catch(error => {

      alert("Login সমস্যা: " + error.message);

    });
}

/* PHONE OTP */

function normalizeBangladeshPhone(phone){

  phone = phone.trim().replace(/\s+/g,"");

  if(phone.startsWith("+880")){
    return phone;
  }

  if(phone.startsWith("880")){
    return "+" + phone;
  }

  if(phone.startsWith("01") && phone.length === 11){
    return "+880" + phone.substring(1);
  }

  return phone;
}

function setupRecaptcha(){

  if(recaptchaVerifier) return;

  recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
    "recaptcha-container",
    {
      size:"normal",
      callback:function(){
        console.log("reCAPTCHA verified");
      },
      "expired-callback":function(){
        alert("reCAPTCHA-এর সময় শেষ হয়েছে। আবার চেষ্টা করুন।");
      }
    }
  );

  recaptchaVerifier.render();
}

function sendOTP(){

  const phoneInput =
    document.getElementById("phoneNumber").value;

  const phone = normalizeBangladeshPhone(phoneInput);

  if(!phone){

    alert("ফোন নম্বর দিন।");
    return;
  }

  setupRecaptcha();

  auth.signInWithPhoneNumber(
    phone,
    recaptchaVerifier
  )
  .then(result => {

    confirmationResult = result;

    document.getElementById("otpArea").style.display = "block";

    alert("আপনার ফোনে OTP পাঠানো হয়েছে। 📱");

  })
  .catch(error => {

    console.error(error);

    alert(
      "OTP পাঠানো যায়নি: " +
      error.message
    );

    if(recaptchaVerifier){

      recaptchaVerifier.clear();
      recaptchaVerifier = null;

    }

  });
}

function verifyOTP(){

  const code =
    document.getElementById("otpCode").value.trim();

  if(!confirmationResult){

    alert("আগে OTP পাঠান।");
    return;
  }

  if(code.length !== 6){

    alert("৬ সংখ্যার OTP দিন।");
    return;
  }

  confirmationResult.confirm(code)
    .then(() => {

      alert("Phone Login সফল হয়েছে। 🎉");

      closeLogin();

      document.getElementById("otpArea").style.display = "none";

    })
    .catch(error => {

      alert(
        "OTP ভুল অথবা মেয়াদ শেষ হয়েছে: " +
        error.message
      );

    });
}

/* AUTH STATE */

auth.onAuthStateChanged(user => {

  const info = document.getElementById("userInfo");
  const logoutBtn = document.getElementById("logoutBtn");

  if(user){

    let identity = user.email || user.phoneNumber || "ব্যবহারকারী";

    info.textContent = "লগইন করা আছে: " + identity;

    logoutBtn.style.display = "inline-block";

  }else{

    info.textContent = "অতিথি ব্যবহারকারী";

    logoutBtn.style.display = "none";

  }
});

function logout(){

  auth.signOut()
    .then(() => {

      alert("Logout হয়েছে।");

    });
}

/* ORDER */

function placeOrder(){

  if(cart.length === 0){

    alert("আগে কার্টে পণ্য যোগ করুন।");
    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const note =
    document.getElementById("customerNote").value.trim();

  if(!name || !phone || !address){

    alert("নাম, ফোন নম্বর এবং ঠিকানা দিন।");
    return;
  }

  const total = cart.reduce(
    (sum,item) => sum + item.price * item.qty,
    0
  );

  const order = {

    orderNumber:
      "BSS-" + Date.now().toString().slice(-8),

    customerName:name,
    customerPhone:phone,
    customerAddress:address,
    note:note,

    items:cart,

    total:total,

    userId:auth.currentUser
      ? auth.currentUser.uid
      : null,

    createdAt:firebase.firestore.FieldValue.serverTimestamp()

  };

  db.collection("orders")
    .add(order)
    .then(() => {

      alert(
        "অর্ডার সফল হয়েছে! 🎉\n\n" +
        "অর্ডার নম্বর: " +
        order.orderNumber
      );

      finishOrder();

    })
    .catch(error => {

      console.error(error);

      /* Firestore permission না থাকলেও অর্ডার হারাবে না */
      const localOrders =
        JSON.parse(
          localStorage.getItem("barishal_orders") || "[]"
        );

      localOrders.push({
        ...order,
        createdAt:new Date().toISOString()
      });

      localStorage.setItem(
        "barishal_orders",
        JSON.stringify(localOrders)
      );

      alert(
        "অর্ডার নেওয়া হয়েছে।\n" +
        "অর্ডার নম্বর: " +
        order.orderNumber
      );

      finishOrder();

    });
}

function finishOrder(){

  cart = [];

  saveCart();

  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("customerAddress").value = "";
  document.getElementById("customerNote").value = "";
}

/* START */

displayProducts();
renderCart();

</script>

</body>
  </html>
