<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বরিশাল সুপার শপ</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:#f5f5f5;
 color:#222
}
header{
 background:#f85606;
 color:white;
 padding:15px
}
.header{
 max-width:1100px;
 margin:auto
}
.logo{
 font-size:25px;
 font-weight:bold;
 margin-bottom:12px
}
.search{
 display:flex;
 background:white;
 border-radius:8px;
 overflow:hidden
}
.search input{
 flex:1;
 padding:13px;
 border:0;
 outline:0;
 font-size:16px
}
.search button{
 width:55px;
 border:0;
 background:#ffe0d0;
 font-size:20px
}
.buttons{
 display:flex;
 gap:8px;
 margin-top:10px
}
.buttons button{
 flex:1;
 padding:10px;
 border:0;
 border-radius:7px;
 font-weight:bold
}
.container{
 max-width:1100px;
 margin:auto;
 padding:15px
}
.banner{
 background:#008c45;
 color:white;
 padding:30px;
 border-radius:12px;
 margin-bottom:15px
}
.banner h1{
 margin:0 0 10px
}
.categories{
 display:flex;
 gap:8px;
 overflow:auto;
 margin-bottom:20px
}
.categories button{
 border:0;
 background:white;
 padding:11px 16px;
 border-radius:20px;
 white-space:nowrap
}
.products{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px
}
.product{
 background:white;
 border-radius:10px;
 overflow:hidden;
 box-shadow:0 2px 7px #0001
}
.photo{
 height:140px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:60px;
 background:#fafafa
}
.info{
 padding:12px
}
.info h3{
 margin:0 0 8px
}
.price{
 color:#f85606;
 font-size:21px;
 font-weight:bold
}
.add{
 width:100%;
 background:#f85606;
 color:white;
 padding:11px;
 border:0;
 border-radius:7px;
 margin-top:10px
}
.cart{
 background:white;
 margin-top:20px;
 padding:18px;
 border-radius:12px
}
.order{
 background:white;
 margin-top:20px;
 padding:18px;
 border-radius:12px
}
input,textarea{
 width:100%;
 padding:13px;
 margin:7px 0;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:16px
}
.order button{
 width:100%;
 padding:13px;
 background:#008c45;
 color:white;
 border:0;
 border-radius:8px;
 font-weight:bold
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:1000
}
.modal.show{
 display:block
}
.modal-box{
 background:white;
 width:92%;
 max-width:450px;
 margin:60px auto;
 padding:22px;
 border-radius:14px;
 position:relative
}
.close{
 position:absolute;
 right:15px;
 top:8px;
 font-size:30px
}
.modal-box button{
 width:100%;
 padding:12px;
 margin-top:8px;
 border:0;
 border-radius:8px;
 background:#f85606;
 color:white;
 font-weight:bold
}
.cart-item{
 padding:10px 0;
 border-bottom:1px solid #ddd
}

@media(max-width:800px){
 .products{
  grid-template-columns:repeat(2,1fr)
 }
 .photo{
  height:110px
 }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
🛒 বরিশাল সুপার শপ
</div>

<div class="search">
<input id="search" placeholder="🔎 পণ্য খুঁজুন..." oninput="showProducts()">
<button>🔍</button>
</div>

<div class="buttons">
<button onclick="openLogin()">👤 Login</button>
<button onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</div>

</div>
</header>

<div class="container">

<div class="banner">
<h1>বরিশাল সুপার শপ</h1>
<p>আপনার প্রয়োজনীয় সব পণ্য এক জায়গায়</p>
</div>

<h2>🏷️ ক্যাটাগরি</h2>

<div class="categories">
<button onclick="filter('সব')">সব</button>
<button onclick="filter('মুদি')">🍚 মুদি</button>
<button onclick="filter('তেল')">🫗 তেল</button>
<button onclick="filter('স্ন্যাকস')">🍪 স্ন্যাকস</button>
<button onclick="filter('গৃহস্থালি')">🧼 গৃহস্থালি</button>
</div>

<h2>🔥 জনপ্রিয় পণ্য</h2>

<div id="products" class="products"></div>

<div class="cart">
<h2>🛒 কার্ট</h2>
<div id="cartItems">কার্ট খালি</div>
<h3>মোট: ৳<span id="total">0</span></h3>
</div>

<div class="order">

<h2>📦 অর্ডার করুন</h2>

<input id="name" placeholder="আপনার নাম">
<input id="phone" placeholder="ফোন নম্বর">
<textarea id="address" placeholder="সম্পূর্ণ ঠিকানা"></textarea>

<button onclick="orderNow()">
অর্ডার কনফার্ম করুন
</button>

</div>

</div>

<!-- LOGIN -->

<div id="loginModal" class="modal">

<div class="modal-box">

<span class="close" onclick="closeLogin()">×</span>

<h2>👤 Login / Register</h2>

<input id="email" placeholder="Gmail / Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<button onclick="register()">
নতুন অ্যাকাউন্ট তৈরি করুন
</button>

<p id="loginMessage"></p>

</div>

</div>

<!-- CART -->

<div id="cartModal" class="modal">

<div class="modal-box">

<span class="close" onclick="closeCart()">×</span>

<h2>🛒 আপনার কার্ট</h2>

<div id="cartModalItems"></div>

<h3>
মোট: ৳<span id="cartModalTotal">0</span>
</h3>

</div>

</div>

<script>

const products=[

{
 id:1,
 name:"চাল",
 price:80,
 emoji:"🍚",
 cat:"মুদি"
},

{
 id:2,
 name:"সয়াবিন তেল",
 price:180,
 emoji:"🫗",
 cat:"তেল"
},

{
 id:3,
 name:"চিনি",
 price:130,
 emoji:"🍬",
 cat:"মুদি"
},

{
 id:4,
 name:"লবণ",
 price:40,
 emoji:"🧂",
 cat:"মুদি"
},

{
 id:5,
 name:"আলু",
 price:45,
 emoji:"🥔",
 cat:"মুদি"
},

{
 id:6,
 name:"সাবান",
 price:50,
 emoji:"🧼",
 cat:"গৃহস্থালি"
},

{
 id:7,
 name:"ডিম",
 price:70,
 emoji:"🥚",
 cat:"মুদি"
},

{
 id:8,
 name:"বিস্কুট",
 price:40,
 emoji:"🍪",
 cat:"স্ন্যাকস"
}

];

let cart=[];

let category="সব";

function showProducts(){

 let search=
 document.getElementById("search").value.toLowerCase();

 let list=products.filter(p=>
 (category==="সব"||p.cat===category)&&
 p.name.toLowerCase().includes(search)
 );

 document.getElementById("products").innerHTML=

 list.map(p=>`

 <div class="product">

 <div class="photo">
 ${p.emoji}
 </div>

 <div class="info">

 <h3>${p.name}</h3>

 <div class="price">
 ৳${p.price}
 </div>

 <button class="add"
 onclick="addCart(${p.id})">
 🛒 কার্টে যোগ করুন
 </button>

 </div>

 </div>

 `).join("");

}

function filter(cat){

 category=cat;

 showProducts();

}

function addCart(id){

 let p=products.find(x=>x.id===id);

 let item=cart.find(x=>x.id===id);

 if(item){

 item.qty++;

 }else{

 cart.push({
  id:p.id,
  name:p.name,
  price:p.price,
  qty:1
 });

 }

 renderCart();

 alert(p.name+" কার্টে যোগ হয়েছে");

}

function renderCart(){

 document.getElementById("cartCount").textContent=

 cart.reduce((a,x)=>a+x.qty,0);

 let total=
 cart.reduce((a,x)=>a+x.price*x.qty,0);

 document.getElementById("total").textContent=total;

 document.getElementById("cartItems").innerHTML=

 cart.length?

 cart.map(x=>`

 <div class="cart-item">

 <b>${x.name}</b>

 ৳${x.price} × ${x.qty}

 </div>

 `).join("")

 :

 "কার্ট খালি";

}

function openCart(){

 document.getElementById("cartModal").classList.add("show");

 document.getElementById("cartModalItems").innerHTML=

 cart.length?

 cart.map(x=>
 `<p>${x.name} × ${x.qty}</p>`
 ).join("")

 :

 "কার্ট খালি";

 document.getElementById("cartModalTotal").textContent=

 cart.reduce((a,x)=>a+x.price*x.qty,0);

}

function closeCart(){

 document.getElementById("cartModal").classList.remove("show");

}

function openLogin(){

 document.getElementById("loginModal").classList.add("show");

}

function closeLogin(){

 document.getElementById("loginModal").classList.remove("show");

}

function register(){

 let email=
 document.getElementById("email").value.trim();

 let password=
 document.getElementById("password").value;

 if(!email||password.length<6){

 alert("Email এবং কমপক্ষে ৬ অক্ষরের Password দিন");

 return;

 }

 let users=
 JSON.parse(localStorage.getItem("bss_users")||"[]");

 if(users.some(u=>u.email===email)){

 alert("এই Email আগে থেকেই আছে");

 return;

 }

 users.push({
  email:email,
  password:password
 });

 localStorage.setItem(
 "bss_users",
 JSON.stringify(users)
 );

 alert("অ্যাকাউন্ট তৈরি হয়েছে 🎉");

 closeLogin();

}

function login(){

 let email=
 document.getElementById("email").value.trim();

 let password=
 document.getElementById("password").value;

 let users=
 JSON.parse(localStorage.getItem("bss_users")||"[]");

 let user=
 users.find(
 u=>u.email===email&&u.password===password
 );

 if(!user){

 alert("Email অথবা Password ভুল");

 return;

 }

 alert("Login সফল হয়েছে 🎉");

 closeLogin();

}

function orderNow(){

 if(cart.length===0){

 alert("আগে কার্টে পণ্য যোগ করুন");

 return;

 }

 let name=
 document.getElementById("name").value.trim();

 let phone=
 document.getElementById("phone").value.trim();

 let address=
 document.getElementById("address").value.trim();

 if(!name||!phone||!address){

 alert("নাম, ফোন এবং ঠিকানা দিন");

 return;

 }

 let order={

 orderNumber:
 "BSS-"+Date.now().toString().slice(-8),

 name:name,

 phone:phone,

 address:address,

 items:cart,

 total:
 cart.reduce((a,x)=>a+x.price*x.qty,0),

 status:"Pending",

 createdAt:new Date().toISOString()

 };

 let orders=
 JSON.parse(localStorage.getItem("bss_orders")||"[]");

 orders.push(order);

 localStorage.setItem(
 "bss_orders",
 JSON.stringify(orders)
 );

 cart=[];

 renderCart();

 alert(
 "অর্ডার সফল হয়েছে 🎉\n\n"+
 "অর্ডার নম্বর: "+order.orderNumber
 );

}

showProducts();

renderCart();

</script>

</body>
  </html>
