<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বরিশাল সুপার শপ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7f9;
  color:#222;
}
header{
  background:#08a558;
  color:white;
  padding:18px 10px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}
header h1{font-size:26px;margin-bottom:12px}
.top-buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
button{
  border:0;
  cursor:pointer;
  border-radius:10px;
  padding:11px 16px;
  font-size:16px;
  font-weight:bold;
}
.top-buttons button{
  background:white;
  color:#087d45;
}
#userStatus{
  margin-top:10px;
  font-size:14px;
}
.hero{
  background:#e5f8ed;
  text-align:center;
  padding:45px 15px;
}
.hero h2{
  color:#087d45;
  font-size:30px;
  margin-bottom:12px;
}
.hero p{font-size:18px}
.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}
.search{
  width:100%;
  padding:17px;
  border:1px solid #ddd;
  border-radius:15px;
  font-size:18px;
  margin-bottom:25px;
}
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}
.product{
  background:white;
  border-radius:18px;
  padding:20px;
  text-align:center;
  box-shadow:0 3px 15px #0001;
}
.product .emoji{
  font-size:60px;
  margin-bottom:10px;
}
.product h3{font-size:23px;margin-bottom:10px}
.price{
  color:#08a558;
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}
.add-btn{
  width:100%;
  background:#08a558;
  color:white;
}
.cart-box{
  margin-top:30px;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 3px 15px #0001;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
  padding:12px 0;
}
.qty button{
  padding:5px 10px;
  background:#eee;
}
.total{
  font-size:22px;
  font-weight:bold;
  color:#087d45;
  margin:20px 0;
}
.checkout-btn{
  background:#087d45;
  color:white;
  width:100%;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
  padding:20px;
  overflow:auto;
}
.card{
  max-width:500px;
  margin:40px auto;
  background:white;
  border-radius:20px;
  padding:25px;
}
.card h2{
  text-align:center;
  color:#087d45;
  margin-bottom:20px;
}
.input{
  width:100%;
  padding:14px;
  margin:7px 0 12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}
.green-btn{
  width:100%;
  background:#08a558;
  color:white;
  margin-top:5px;
}
.red-btn{
  width:100%;
  background:#c62828;
  color:white;
  margin-top:8px;
}
.gray-btn{
  width:100%;
  background:#eee;
  margin-top:8px;
}
.success{
  text-align:center;
  padding:20px;
}
.success h2{color:#08a558}
@media(max-width:600px){
  .products{grid-template-columns:repeat(2,1fr)}
  .product{padding:12px}
  .product .emoji{font-size:48px}
  .product h3{font-size:19px}
  .price{font-size:18px}
  .add-btn{font-size:14px;padding:10px 5px}
}
</style>
</head>

<body>

<header>
  <h1>🛒 বরিশাল সুপার শপ</h1>

  <div class="top-buttons">
    <button onclick="openLogin()">👤 Login</button>
    <button onclick="changeLanguage()">বাংলা / English</button>
    <button onclick="scrollToCart()">🛒 কার্ট (<span id="cartCount">0</span>)</button>
  </div>

  <div id="userStatus">অতিথি ব্যবহারকারী</div>
</header>

<section class="hero">
  <h2>বরিশাল সুপার শপ</h2>
  <p>আপনার প্রয়োজনীয় পণ্য এখন সহজেই অর্ডার করুন</p>
</section>

<div class="container">

<input
  class="search"
  id="search"
  placeholder="🔎 পণ্য খুঁজুন..."
  oninput="showProducts()"
>

<div class="products" id="products"></div>

<div class="cart-box" id="cartBox">
  <h2>🛒 আপনার কার্ট</h2>
  <div id="cartItems"></div>

  <div class="total">
    মোট: ৳ <span id="total">0</span>
  </div>

  <button class="checkout-btn" onclick="openCheckout()">
    অর্ডার করুন
  </button>
</div>

</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="card">
    <h2>👤 Login / Register</h2>

    <input class="input" id="email" type="email" placeholder="Email">
    <input class="input" id="password" type="password" placeholder="Password">

    <button class="green-btn" onclick="loginUser()">Login</button>

    <button class="green-btn" onclick="registerUser()">
      নতুন Account তৈরি করুন
    </button>

    <button class="gray-btn" onclick="closeLogin()">বন্ধ করুন</button>
  </div>
</div>

<!-- CHECKOUT -->
<div class="modal" id="checkoutModal">
  <div class="card">

    <h2>🛍️ অর্ডার তথ্য</h2>

    <input class="input" id="customerName" placeholder="আপনার নাম">

    <input
      class="input"
      id="customerPhone"
      type="tel"
      placeholder="মোবাইল নম্বর"
    >

    <textarea
      class="input"
      id="customerAddress"
      rows="4"
      placeholder="সম্পূর্ণ ঠিকানা"
    ></textarea>

    <textarea
      class="input"
      id="customerNote"
      rows="3"
      placeholder="অতিরিক্ত কথা (ঐচ্ছিক)"
    ></textarea>

    <div class="total">
      মোট অর্ডার: ৳ <span id="checkoutTotal">0</span>
    </div>

    <button class="green-btn" onclick="confirmOrder()">
      ✅ অর্ডার নিশ্চিত করুন
    </button>

    <button class="gray-btn" onclick="closeCheckout()">
      বাতিল
    </button>

  </div>
</div>

<!-- SUCCESS -->
<div class="modal" id="successModal">
  <div class="card success">
    <h2>🎉 অর্ডার সফল!</h2>
    <p id="successText"></p>
    <br>
    <button class="green-btn" onclick="closeSuccess()">
      ঠিক আছে
    </button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAYlIFso46tdo9E-jig-tzGo3Sv77dpaPg",
  authDomain: "barishal-super-shop.firebaseapp.com",
  projectId: "barishal-super-shop",
  storageBucket: "barishal-super-shop.firebasestorage.app",
  messagingSenderId: "484705312821",
  appId: "1:484705312821:web:e8eae37eaa74dcc0c5517c",
  measurementId: "G-K97DXFFCB5"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================
   PRODUCTS
========================= */

const products = [
  {id:1,name:"চাল",price:80,unit:"কেজি",emoji:"🍚"},
  {id:2,name:"সয়াবিন তেল",price:180,unit:"লিটার",emoji:"🛢️"},
  {id:3,name:"চিনি",price:130,unit:"কেজি",emoji:"🍬"},
  {id:4,name:"লবণ",price:40,unit:"কেজি",emoji:"🧂"},
  {id:5,name:"আলু",price:45,unit:"কেজি",emoji:"🥔"},
  {id:6,name:"সাবান",price:50,unit:"পিস",emoji:"🧼"},
  {id:7,name:"ডিম",price:70,unit:"ডজন",emoji:"🥚"},
  {id:8,name:"বিস্কুট",price:40,unit:"প্যাকেট",emoji:"🍪"}
];

let cart = JSON.parse(localStorage.getItem("barishal_cart") || "[]");


/* =========================
   PRODUCTS SHOW
========================= */

function showProducts(){

  const box = document.getElementById("products");
  const search = document.getElementById("search").value.toLowerCase();

  box.innerHTML = "";

  products
  .filter(p => p.name.toLowerCase().includes(search))
  .forEach(p => {

    box.innerHTML += `
      <div class="product">

        <div class="emoji">${p.emoji}</div>

        <h3>${p.name}</h3>

        <div class="price">
          ৳${p.price} / ${p.unit}
        </div>

        <button class="add-btn"
          onclick="addToCart(${p.id})">
          🛒 কার্টে যোগ করুন
        </button>

      </div>
    `;

  });
}


/* =========================
   CART
========================= */

function addToCart(id){

  const product = products.find(p => p.id === id);

  const existing = cart.find(p => p.id === id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      id:product.id,
      name:product.name,
      price:product.price,
      unit:product.unit,
      emoji:product.emoji,
      qty:1
    });
  }

  saveCart();
  showCart();

  alert(product.name + " কার্টে যোগ হয়েছে ✅");
}


function changeQty(id,change){

  const item = cart.find(p => p.id === id);

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0){
    cart = cart.filter(p => p.id !== id);
  }

  saveCart();
  showCart();
}


function saveCart(){
  localStorage.setItem("barishal_cart",JSON.stringify(cart));
}


function showCart(){

  const box = document.getElementById("cartItems");

  box.innerHTML = "";

  let total = 0;
  let count = 0;

  cart.forEach(item => {

    total += item.price * item.qty;
    count += item.qty;

    box.innerHTML += `
      <div class="cart-item">

        <div>
          ${item.emoji} ${item.name}
          <br>
          ৳${item.price} × ${item.qty}
        </div>

        <div class="qty">
          <button onclick="changeQty(${item.id},-1)">−</button>
          <b>${item.qty}</b>
          <button onclick="changeQty(${item.id},1)">+</button>
        </div>

      </div>
    `;
  });

  if(cart.length === 0){
    box.innerHTML = "<p>কার্ট এখন খালি 😔</p>";
  }

  document.getElementById("total").textContent = total;
  document.getElementById("cartCount").textContent = count;
}


function getTotal(){

  return cart.reduce(
    (sum,item) => sum + item.price * item.qty,
    0
  );

}


/* =========================
   CHECKOUT
========================= */

function openCheckout(){

  if(cart.length === 0){
    alert("আগে কিছু পণ্য কার্টে যোগ করুন 🛒");
    return;
  }

  document.getElementById("checkoutTotal").textContent = getTotal();

  document.getElementById("checkoutModal").style.display = "block";
}


function closeCheckout(){
  document.getElementById("checkoutModal").style.display = "none";
}


/* =========================
   CONFIRM ORDER
========================= */

async function confirmOrder(){

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const note =
    document.getElementById("customerNote").value.trim();

  if(!name || !phone || !address){

    alert("নাম, মোবাইল নম্বর এবং ঠিকানা পূরণ করুন।");
    return;
  }

  if(phone.length < 11){

    alert("সঠিক মোবাইল নম্বর দিন।");
    return;
  }

  const orderNumber =
    "BSS-" + Date.now().toString().slice(-8);

  const order = {

    orderNumber: orderNumber,

    customerName: name,

    phone: phone,

    address: address,

    note: note,

    items: cart,

    total: getTotal(),

    userId: auth.currentUser
      ? auth.currentUser.uid
      : "guest",

    createdAt: new Date().toISOString()

  };


  /* Firebase-এ সংরক্ষণ চেষ্টা */

  try{

    await db.collection("orders").add(order);

  }catch(error){

    console.log("Firebase order save:",error);

    /* Firebase না হলেও অর্ডার হারাবে না */
    let oldOrders =
      JSON.parse(localStorage.getItem("barishal_orders") || "[]");

    oldOrders.push(order);

    localStorage.setItem(
      "barishal_orders",
      JSON.stringify(oldOrders)
    );
  }


  cart = [];

  saveCart();
  showCart();

  closeCheckout();

  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("customerAddress").value = "";
  document.getElementById("customerNote").value = "";

  document.getElementById("successText").innerHTML =
    "আপনার অর্ডার নম্বর:<br><br>" +
    "<b>" + orderNumber + "</b><br><br>" +
    "আপনার অর্ডার গ্রহণ করা হয়েছে। ❤️";

  document.getElementById("successModal").style.display = "block";
}


function closeSuccess(){
  document.getElementById("successModal").style.display = "none";
}


/* =========================
   LOGIN
========================= */

function openLogin(){
  document.getElementById("loginModal").style.display = "block";
}


function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}


async function registerUser(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Email এবং Password দিন।");
    return;
  }

  if(password.length < 6){

    alert("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
    return;
  }

  try{

    await auth.createUserWithEmailAndPassword(
      email,
      password
    );

    alert("Account সফলভাবে তৈরি হয়েছে ✅");

    closeLogin();

  }catch(error){

    alert("Account তৈরি করা যায়নি:\n" + error.message);

  }

}


async function loginUser(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Email এবং Password দিন।");
    return;
  }

  try{

    await auth.signInWithEmailAndPassword(
      email,
      password
    );

    alert("Login সফল হয়েছে ✅");

    closeLogin();

  }catch(error){

    alert("Login করা যায়নি:\n" + error.message);

  }

}


function logoutUser(){

  auth.signOut();

}


/* =========================
   AUTH STATUS
========================= */

auth.onAuthStateChanged(user => {

  const status =
    document.getElementById("userStatus");

  if(user){

    status.innerHTML =
      "✅ লগইন: " + user.email +
      ' <button onclick="logoutUser()" style="padding:5px 8px;margin-left:5px">Logout</button>';

  }else{

    status.textContent = "অতিথি ব্যবহারকারী";

  }

});


/* =========================
   OTHER
========================= */

function scrollToCart(){

  document.getElementById("cartBox")
    .scrollIntoView({behavior:"smooth"});

}


function changeLanguage(){

  alert("বাংলা / English ভাষা সিস্টেম পরে আরও সম্পূর্ণভাবে যোগ করা হবে।");

}


/* =========================
   START
========================= */

showProducts();
showCart();

</script>

</body>
</html>
